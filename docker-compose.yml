version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vep_backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5000"
    networks:
      - vep_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vep_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vep_network

networks:
  vep_network:
    driver: bridge
